name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: swift test

      - name: Package app
        run: ./build.sh

      - name: Zip
        run: ditto -c -k --keepParent dist/MarkPad.app "MarkPad-${GITHUB_REF_NAME}.zip"

      - name: Checksums
        run: shasum -a 256 "MarkPad-${GITHUB_REF_NAME}.zip" > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            MarkPad-${{ github.ref_name }}.zip
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Universal binary (Apple silicon + Intel), macOS 14 or later.

            The app is ad-hoc signed and not notarized, so macOS blocks the first launch.
            Either allow it in System Settings → Privacy & Security → "Open Anyway", or run
            `xattr -d com.apple.quarantine /Applications/MarkPad.app`. See the README's Install section.
