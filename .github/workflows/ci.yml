name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Toolchain
        run: swift --version

      - name: Unit tests
        run: swift test

      - name: Package app
        run: ./build.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: MarkPad.app
          path: dist/MarkPad.app
          if-no-files-found: error
